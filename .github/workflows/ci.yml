name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  bun:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun (version from package.json packageManager)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun install cache (dependencies and the pinned lint canary)
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create config.yaml
        run: cp config.example.yaml config.yaml

      - name: Show versions
        run: |
          bun --version
          bunx bun@1.4.4-canary.20261104.1 --revision

      - name: Verify formatting
        run: bun run fmt:check

      - name: Run linter
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Run transport tests
        run: bun run test:transport

  image:
    needs: bun
    runs-on: ubuntu-24.04
    concurrency: image-${{ github.ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, and push from master
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' }}
          provenance: false
          tags: |
            ghcr.io/steveny9911/weabot:latest
            ghcr.io/steveny9911/weabot:${{ github.sha }}
      - name: Keep the 10 newest images
        if: github.ref == 'refs/heads/master'
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          keep-n-tagged: 10
