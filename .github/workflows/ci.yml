name: CI

on:
  push:
    branches: [master, feat/aws-hosting]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deno: [v2.6.0, v2.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: ${{ matrix.deno }}

      - name: Verify formatting
        run: deno fmt --check

      - name: Run linter
        run: deno lint

      - name: Type check
        run: deno task check

      - name: Run all tests, including concurrency and poll collection regressions
        run: deno task test --reporter=pretty

      - name: Verify pinned HTTP and TLS transport on loopback fixtures
        run: deno task test:transport
