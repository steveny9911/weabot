name: CI

on:
  push:
    branches: [master, feat/aws-hosting, feat/bun]
  pull_request:

jobs:
  validate-infrastructure:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CloudFormation schema validator
        run: python -m pip install cfn-lint==1.56.0

      - name: Validate AWS infrastructure schema
        run: |
          cfn-lint --info --non-zero-exit-code error --regions us-west-2 --template deploy/aws/cloudformation.yml
          cfn-lint --info --non-zero-exit-code error --regions us-west-2 --template deploy/aws/cloudformation.yml --parameters ExistingAmiId=ami-0123456789abcdef0 RepositoryRef=ci-validation VpcId=vpc-0123456789abcdef0 SubnetId=subnet-0123456789abcdef0

  lint-and-test:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        deno: [v2.6.0, v2.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: ${{ matrix.deno }}

      - name: Run linter
        run: deno lint

      - name: Type check
        run: deno task check

      - name: Run all tests, including concurrency and poll collection regressions
        run: deno task test --reporter=pretty

  bun:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun (version from package.json packageManager)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun install cache (dependencies and the pinned lint canary)
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Show versions
        run: |
          bun --version
          bunx bun@1.4.4-canary.20261104.1 --revision

      - name: Verify formatting
        run: bun run fmt:check

      - name: Run linter
        run: bun run lint

      - name: Type check and test ported files, comparing counts with the Deno baseline
        run: bun run migration:gate
