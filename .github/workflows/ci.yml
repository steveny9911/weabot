name: CI

on:
  push:
    branches: [master, feat/aws-hosting]
  pull_request:

jobs:
  validate-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CloudFormation schema validator
        run: python -m pip install cfn-lint==1.56.0

      - name: Validate AWS infrastructure schema
        run: |
          cfn-lint --info --non-zero-exit-code error --regions us-west-2 --template deploy/aws/cloudformation.yml
          cfn-lint --info --non-zero-exit-code error --regions us-west-2 --template deploy/aws/cloudformation.yml --parameters ExistingAmiId=ami-0123456789abcdef0 RepositoryRef=ci-validation VpcId=vpc-0123456789abcdef0 SubnetId=subnet-0123456789abcdef0

  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deno: [v2.6.0, v2.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: ${{ matrix.deno }}

      - name: Verify formatting
        run: deno fmt --check

      - name: Run linter
        run: deno lint

      - name: Type check
        run: deno task check

      - name: Run all tests, including concurrency and poll collection regressions
        run: deno task test --reporter=pretty

      - name: Verify pinned HTTP and TLS transport on loopback fixtures
        run: deno task test:transport
