services:
  haru:
    image: ghcr.io/steveny9911/weabot:latest
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs: /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
