services:
  haru:
    image: ghcr.io/steveny9911/weabot:latest
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs: /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "process.exit((await fetch('http://localhost:8000/health')).ok ? 0 : 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
