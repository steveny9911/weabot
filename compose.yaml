services:
  haru:
    image: ghcr.io/steveny9911/weabot:latest
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:8000/health').then(r => process.exit(r.ok ? 0 : 1), () =>
          process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs: /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
